[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cota-preco-ai"
version = "0.1.0"
description = "Cota.Preço.AI — assistente de compras e comparação de preços"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1", "openai>=2,<3", "pypdf>=5,<7", "PyMuPDF>=1.25,<2", "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
