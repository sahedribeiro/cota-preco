<!doctype html><html lang="pt-AO"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar · Cota.Preço.AI</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="request-content"><h1>Cota.Preço.AI</h1><h2>Entrar</h2>{% if error %}<p role="alert">{{ error }}</p>{% endif %}<form action="/login" method="post" class="edit-card"><input type="hidden" name="_csrf" value="{{ csrf }}"><label>Utilizador<input name="username" required maxlength="100" autocomplete="username"></label><label>Palavra-passe<input type="password" name="password" required maxlength="1024" autocomplete="current-password"></label><button class="send">Entrar</button></form><p>Primeiro acesso: o administrador cria a conta com <code>python -m app.manage_users nome</code>.</p></main></body></html>
